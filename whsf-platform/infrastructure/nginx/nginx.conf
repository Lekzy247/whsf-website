worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 10m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  map $http_x_request_id $request_id {
    default $http_x_request_id;
    "" $request_id;
  }

  upstream web { server web:3000; }
  upstream admin { server admin:3001; }
  upstream api { server api:8000; }

  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /operations/ {
      proxy_pass http://admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
