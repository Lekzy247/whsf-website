name: Stabilize AgriLearn Phases 1-10

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agrilearn-phase1-10-stabilize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agrilearn-stabilization
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate consolidated production foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path('.')
          files = {
          'agrilearn-api/requirements.txt': '''fastapi==0.115.6
uvicorn[standard]==0.34.0
pydantic-settings==2.7.1
sqlalchemy==2.0.36
python-multipart==0.0.20
httpx==0.28.1
pytest==8.3.4
''',
          'agrilearn-api/app/__init__.py': '',
          'agrilearn-api/app/main.py': '''from __future__ import annotations

import json
import os
from datetime import datetime, timezone
from pathlib import Path
from typing import Any

import httpx
from fastapi import FastAPI, File, Form, HTTPException, Query, UploadFile
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel, Field
from sqlalchemy import DateTime, Float, Integer, String, create_engine
from sqlalchemy.orm import DeclarativeBase, Mapped, Session, mapped_column

APP_VERSION = "10.0.0"
DATABASE_URL = os.getenv("AGRILEARN_DATABASE_URL", "sqlite:///./agrilearn.db")
LIVE_WEATHER = os.getenv("AGRILEARN_LIVE_WEATHER", "false").lower() == "true"
MAX_UPLOAD_BYTES = 10 * 1024 * 1024
ALLOWED_IMAGES = {"image/jpeg": "jpg", "image/png": "png", "image/webp": "webp"}

class Base(DeclarativeBase):
    pass

class Diagnosis(Base):
    __tablename__ = "diagnoses"
    id: Mapped[int] = mapped_column(Integer, primary_key=True)
    crop: Mapped[str] = mapped_column(String(100), index=True)
    image_name: Mapped[str] = mapped_column(String(255))
    status: Mapped[str] = mapped_column(String(60), default="expert_review_required")
    confidence: Mapped[float] = mapped_column(Float, default=0.0)
    created_at: Mapped[datetime] = mapped_column(DateTime, default=lambda: datetime.now(timezone.utc))

connect_args = {"check_same_thread": False} if DATABASE_URL.startswith("sqlite") else {}
engine = create_engine(DATABASE_URL, connect_args=connect_args)
Base.metadata.create_all(engine)

app = FastAPI(
    title="AgriLearn AI API",
    version=APP_VERSION,
    description="WHSF agriculture learning, weather and human-reviewed crop diagnosis API.",
)
app.add_middleware(
    CORSMiddleware,
    allow_origins=[origin.strip() for origin in os.getenv("AGRILEARN_ALLOWED_ORIGINS", "*").split(",")],
    allow_credentials=False,
    allow_methods=["GET", "POST", "OPTIONS"],
    allow_headers=["*"],
)

KNOWLEDGE: list[dict[str, Any]] = [
    {
        "id": "cassava-mosaic-screening",
        "crop": "cassava",
        "topic": "disease",
        "title": "Cassava mosaic symptom screening",
        "symptoms": ["mosaic leaf patterns", "leaf distortion", "stunted growth"],
        "guidance": [
            "Photograph young and mature leaves in good light.",
            "Compare affected plants with healthy plants in the same field.",
            "Ask a qualified agronomist or extension officer to confirm the diagnosis.",
        ],
        "safety": "Do not prescribe pesticides from image evidence alone.",
    },
    {
        "id": "tomato-leaf-spot-screening",
        "crop": "tomato",
        "topic": "disease",
        "title": "Tomato leaf spot differential screening",
        "symptoms": ["circular lesions", "yellowing", "lower leaves affected"],
        "guidance": [
            "Photograph both leaf surfaces and the whole plant.",
            "Record rainfall, humidity and irrigation conditions.",
            "Obtain expert confirmation because bacterial and fungal symptoms can overlap.",
        ],
        "safety": "Do not prescribe fungicides or antibiotics without local expert confirmation.",
    },
    {
        "id": "maize-nitrogen-screening",
        "crop": "maize",
        "topic": "nutrient",
        "title": "Maize nitrogen-stress screening",
        "symptoms": ["pale leaves", "V-shaped yellowing", "reduced vigor"],
        "guidance": [
            "Confirm whether symptoms begin on older leaves.",
            "Review rainfall, fertilizer history and soil-test information.",
            "Use soil or tissue testing before changing fertilizer applications.",
        ],
        "safety": "Do not calculate fertilizer dosage without verified local agronomic data.",
    },
]

class FarmInput(BaseModel):
    name: str = Field(min_length=2, max_length=160)
    country: str = Field(min_length=2, max_length=100)
    state: str = Field(min_length=2, max_length=100)
    crop: str = Field(min_length=2, max_length=100)
    area: float = Field(gt=0)
    unit: str = Field(default="hectares", max_length=30)

FARMS: list[dict[str, Any]] = []

@app.get("/")
def root() -> dict[str, Any]:
    return {"service": "AgriLearn AI", "version": APP_VERSION, "docs": "/docs", "health": "/api/agrilearn/v1/health"}

@app.get("/api/agrilearn/v1/health")
def health() -> dict[str, Any]:
    return {"status": "healthy", "version": APP_VERSION, "time": datetime.now(timezone.utc).isoformat()}

@app.get("/api/agrilearn/v1/features")
def features() -> dict[str, Any]:
    return {
        "farmer_portal": True,
        "expert_review": True,
        "knowledge_retrieval": True,
        "live_weather": LIVE_WEATHER,
        "ai_diagnosis": False,
        "diagnosis_policy": "human-review-required",
    }

@app.get("/api/agrilearn/v1/knowledge/search")
def knowledge_search(crop: str = Query(min_length=2), query: str = "") -> dict[str, Any]:
    terms = {term.lower() for term in query.split() if term.strip()}
    crop_name = crop.lower().strip()
    results = []
    for entry in KNOWLEDGE:
        text = json.dumps(entry).lower()
        if entry["crop"] == crop_name or any(term in text for term in terms):
            results.append(entry)
    return {"review_status": "pilot-curated", "results": results}

@app.get("/api/agrilearn/v1/weather/forecast")
async def weather(lat: float, lng: float) -> dict[str, Any]:
    if not (-90 <= lat <= 90 and -180 <= lng <= 180):
        raise HTTPException(422, "Invalid latitude or longitude")
    if not LIVE_WEATHER:
        return {
            "status": "demonstration",
            "location": {"latitude": lat, "longitude": lng},
            "warning": "Live weather is disabled until staging validation is completed.",
            "forecast": [],
        }
    url = "https://api.open-meteo.com/v1/forecast"
    params = {
        "latitude": lat,
        "longitude": lng,
        "current": "temperature_2m,relative_humidity_2m,precipitation,weather_code",
        "daily": "temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        "forecast_days": 5,
        "timezone": "auto",
    }
    try:
        async with httpx.AsyncClient(timeout=12) as client:
            response = await client.get(url, params=params)
            response.raise_for_status()
    except httpx.HTTPError as exc:
        raise HTTPException(502, "Weather provider is temporarily unavailable") from exc
    return {"status": "live", "provider": "Open-Meteo", "data": response.json(), "advisory": "Verify local conditions before farm decisions."}

@app.get("/api/agrilearn/v1/farms")
def list_farms() -> list[dict[str, Any]]:
    return FARMS

@app.post("/api/agrilearn/v1/farms", status_code=201)
def create_farm(payload: FarmInput) -> dict[str, Any]:
    item = {"id": len(FARMS) + 1, **payload.model_dump()}
    FARMS.append(item)
    return item

@app.post("/api/agrilearn/v1/diagnoses", status_code=202)
async def create_diagnosis(crop: str = Form(min_length=2), image: UploadFile = File(...)) -> dict[str, Any]:
    if image.content_type not in ALLOWED_IMAGES:
        raise HTTPException(415, "Upload a JPEG, PNG or WEBP image")
    content = await image.read(MAX_UPLOAD_BYTES + 1)
    if len(content) > MAX_UPLOAD_BYTES:
        raise HTTPException(413, "Image exceeds the 10 MB limit")
    upload_dir = Path(os.getenv("AGRILEARN_UPLOAD_DIR", "./uploads"))
    upload_dir.mkdir(parents=True, exist_ok=True)
    safe_name = f"{datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S%f')}.{ALLOWED_IMAGES[image.content_type]}"
    (upload_dir / safe_name).write_bytes(content)
    with Session(engine) as session:
        record = Diagnosis(crop=crop.strip().lower(), image_name=safe_name)
        session.add(record)
        session.commit()
        session.refresh(record)
        diagnosis_id = record.id
    return {
        "id": diagnosis_id,
        "status": "expert_review_required",
        "confidence": 0.0,
        "message": "The image was received. No automated treatment recommendation has been issued.",
    }

@app.get("/api/agrilearn/v1/impact/summary")
def impact_summary() -> dict[str, Any]:
    with Session(engine) as session:
        diagnoses = session.query(Diagnosis).count()
    return {"farms_registered": len(FARMS), "diagnoses_submitted": diagnoses, "expert_review_policy": "required", "countries_active": 0}
''',
          'agrilearn-api/tests/test_api.py': '''from fastapi.testclient import TestClient
from app.main import app

client = TestClient(app)

def test_health():
    response = client.get("/api/agrilearn/v1/health")
    assert response.status_code == 200
    assert response.json()["status"] == "healthy"

def test_features_are_safe_by_default():
    data = client.get("/api/agrilearn/v1/features").json()
    assert data["ai_diagnosis"] is False
    assert data["diagnosis_policy"] == "human-review-required"

def test_knowledge_search():
    response = client.get("/api/agrilearn/v1/knowledge/search?crop=cassava&query=mosaic")
    assert response.status_code == 200
    assert response.json()["results"][0]["crop"] == "cassava"

def test_weather_demo_default():
    response = client.get("/api/agrilearn/v1/weather/forecast?lat=7.37&lng=3.94")
    assert response.status_code == 200
    assert response.json()["status"] == "demonstration"

def test_create_farm():
    response = client.post("/api/agrilearn/v1/farms", json={"name":"Pilot Farm","country":"Nigeria","state":"Oyo","crop":"cassava","area":2.5,"unit":"hectares"})
    assert response.status_code == 201
    assert response.json()["crop"] == "cassava"
''',
