          'agrilearn/app.js': '''const API = localStorage.getItem("agrilearnApi") || "http://localhost:8000/api/agrilearn/v1";
const statusBox = document.querySelector("#system-status");
fetch(`${API}/health`).then(r => r.ok ? r.json() : Promise.reject()).then(data => { statusBox.textContent = `Platform API: ${data.status} • v${data.version}`; }).catch(() => { statusBox.textContent = "Preview mode: connect the deployed AgriLearn API to enable submissions."; });

document.querySelector("#diagnosis-form").addEventListener("submit", async event => {
  event.preventDefault();
  const result = document.querySelector("#diagnosis-result");
  result.textContent = "Submitting…";
  try {
    const response = await fetch(`${API}/diagnoses`, { method: "POST", body: new FormData(event.currentTarget) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Submission failed");
    result.textContent = `Case ${data.id}: ${data.message}`;
    event.currentTarget.reset();
  } catch (error) { result.textContent = `${error.message}. Confirm the API address and CORS settings.`; }
});

document.querySelector("#knowledge-form").addEventListener("submit", async event => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const params = new URLSearchParams({ crop: form.get("crop"), query: form.get("query") || "" });
  const box = document.querySelector("#knowledge-results");
  box.textContent = "Searching…";
  try {
    const response = await fetch(`${API}/knowledge/search?${params}`);
    const data = await response.json();
    box.innerHTML = data.results.length ? data.results.map(item => `<article><h3>${item.title}</h3><p><strong>Symptoms:</strong> ${item.symptoms.join(", ")}</p><p>${item.guidance.join(" ")}</p><p><strong>Safety:</strong> ${item.safety}</p></article>`).join("") : "<p>No pilot entry matched. Contact an agronomist.</p>";
  } catch { box.textContent = "Knowledge service unavailable. Confirm the deployed API address."; }
});
''',
