          'agrilearn-api/README.md': '''# AgriLearn AI API

A consolidated, runnable FastAPI foundation for WHSF AgriLearn.

## Local development

```bash
python -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
uvicorn app.main:app --reload
```

Open `http://localhost:8000/docs`.

## Safety

Automated crop treatment advice is disabled. Submitted diagnoses are marked for expert review. Live weather is disabled by default and must be enabled only after staging validation.
''',
