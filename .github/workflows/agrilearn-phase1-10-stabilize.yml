          'scripts/site_audit.py': '''from html.parser import HTMLParser
from pathlib import Path
from urllib.parse import urlparse
import sys

ROOT = Path(__file__).resolve().parents[1]
IGNORE = {"mailto", "tel", "http", "https", "javascript", "data"}

class Parser(HTMLParser):
    def __init__(self):
        super().__init__(); self.refs=[]
    def handle_starttag(self, tag, attrs):
        values=dict(attrs)
        for key in ("href","src"):
            if key in values:self.refs.append((tag,key,values[key]))

errors=[]
html_files=[p for p in ROOT.rglob("*.html") if ".git" not in p.parts]
for html in html_files:
    parser=Parser();parser.feed(html.read_text(encoding="utf-8-sig",errors="replace"))
    for tag,key,value in parser.refs:
        value=(value or "").strip()
        if not value or value.startswith("#"):continue
        parsed=urlparse(value)
        if parsed.scheme in IGNORE or value.startswith("//"):continue
        path=value.split("#",1)[0].split("?",1)[0]
        if not path:continue
        target=(ROOT/path.lstrip("/")) if path.startswith("/") else (html.parent/path)
        if not target.exists():errors.append(f"{html.relative_to(ROOT)}: missing {key}={value}")
print(f"Audited {len(html_files)} HTML files")
if errors:
    print("\n".join(errors));sys.exit(1)
print("All local HTML links and assets resolve.")
''',
