          'AGRILEARN_PHASES_1_10_AUDIT.md': '''# AgriLearn Phases 1–10 Consolidated Audit

## Result
The earlier repository contained a working static WHSF website and several phase-generator workflows, but the later generated backend artifacts were not consistently present on `main`. This stabilization release replaces the fragile workflow chain with a directly testable website, AgriLearn portal and backend foundation.

## Phase status
1. **Public experience:** WHSF website retained; AgriLearn receives its own accessible portal.
2. **AI workflow UX:** Crop, image and knowledge-search interactions are implemented.
3. **PWA/offline foundation:** Existing WHSF manifest/service-worker assets remain available; AgriLearn is static-host compatible.
4. **Smart farming:** Farm records, weather endpoint and educational knowledge support are available.
5. **Portals/roles foundation:** Farmer-facing portal exists; expert review is enforced as a policy. Production identity remains an external deployment configuration.
6. **Backend MVP:** Runnable FastAPI API, validation, SQLite persistence, Docker and tests are included.
7. **Security/staging:** CORS configuration, upload restrictions, safe defaults, environment configuration and container deployment are included. OIDC must be configured before protected production accounts are launched.
8. **Controlled intelligence:** Knowledge retrieval is active; automated treatment diagnosis is deliberately disabled; live weather is feature-flagged.
