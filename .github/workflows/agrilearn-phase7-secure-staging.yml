          'agrilearn-api/staging.compose.yml':'''services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO
    env_file: [.env]
    depends_on: [db,redis]
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrilearn
      POSTGRES_USER: agrilearn
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U agrilearn"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
''',
          'AGRILEARN_PHASE7.md':'''# AgriLearn AI Phase 7 — Secure Staging Foundation

## Delivered
- OIDC/JWT validation and role dependency framework
- Development authentication mode for local testing only
- `/account/me` identity endpoint
- Alembic migration framework and initial schema migration
- Local and encrypted S3 object-storage adapters
- Redis/Celery background-worker foundation
- Staging Compose topology for API, worker, PostGIS and Redis
- Authentication tests and updated environment configuration

## Security boundary
Development authentication grants local roles and must never be enabled in production. Production requires a configured OIDC issuer, JWKS URL, audience, HTTPS, managed secrets, restricted CORS, encrypted storage, logging, monitoring and tested backup/restore procedures.

## Next recommended milestone
Connect one identity provider and deploy a protected staging environment. Then connect one verified weather provider and a human-reviewed crop-diagnosis pilot model behind feature flags.
'''
