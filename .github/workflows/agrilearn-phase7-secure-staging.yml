name: Build AgriLearn Phase 7 Secure Staging Foundation

on:
  workflow_run:
    workflows: ["Build AgriLearn Phase 6 Backend MVP"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync generated Phase 6 backend
        run: |
          git pull --ff-only origin "${{ github.event.repository.default_branch }}"
          test -d agrilearn-api || { echo "Phase 6 backend is not present. Run the Phase 6 workflow successfully first."; exit 1; }

      - name: Build secure staging foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('.')
          api=root/'agrilearn-api'
          app=api/'app'
          for p in [app/'auth', app/'storage', app/'workers', api/'alembic/versions', api/'.github/workflows']:
              p.mkdir(parents=True,exist_ok=True)

          req=api/'requirements.txt'
          current=req.read_text(encoding='utf-8')
          additions=['alembic==1.14.0','PyJWT[crypto]==2.10.1','redis==5.2.1','celery==5.4.0','boto3==1.35.90']
          for item in additions:
              if item not in current: current += item+'\n'
          req.write_text(current,encoding='utf-8')

          env=api/'.env.example'
          text=env.read_text(encoding='utf-8')
          more='''AGRILEARN_AUTH_MODE=dev
AGRILEARN_OIDC_ISSUER=
AGRILEARN_OIDC_AUDIENCE=agrilearn-api
AGRILEARN_OIDC_JWKS_URL=
AGRILEARN_STORAGE_PROVIDER=local
AGRILEARN_S3_BUCKET=
AGRILEARN_S3_REGION=us-east-1
AGRILEARN_REDIS_URL=redis://redis:6379/0
'''
          if 'AGRILEARN_AUTH_MODE' not in text: env.write_text(text+more,encoding='utf-8')

          config=app/'core/config.py'
          t=config.read_text(encoding='utf-8')
          marker='    secret_key: str = "replace-in-production"\n'
          insert='''    auth_mode: str = "dev"
    oidc_issuer: str = ""
    oidc_audience: str = "agrilearn-api"
    oidc_jwks_url: str = ""
    storage_provider: str = "local"
    s3_bucket: str = ""
    s3_region: str = "us-east-1"
    redis_url: str = "redis://localhost:6379/0"
'''
          if 'auth_mode:' not in t: t=t.replace(marker,marker+insert)
          config.write_text(t,encoding='utf-8')

          files={
          'agrilearn-api/app/auth/__init__.py':'',
          'agrilearn-api/app/auth/security.py':'''from dataclasses import dataclass
from functools import lru_cache
import jwt
from fastapi import Depends, Header, HTTPException, status
from jwt import PyJWKClient
from app.core.config import get_settings

@dataclass
class Principal:
    subject: str
    email: str|None
    roles: list[str]

@lru_cache
def jwks_client(url:str):
    return PyJWKClient(url)

def get_principal(authorization:str|None=Header(default=None)) -> Principal:
    settings=get_settings()
    if settings.auth_mode == "dev":
        return Principal(subject="dev-user",email="developer@localhost",roles=["farmer","agronomist","admin"])
    if not authorization or not authorization.startswith("Bearer "):
        raise HTTPException(status.HTTP_401_UNAUTHORIZED,"Bearer token required")
    if not settings.oidc_jwks_url or not settings.oidc_issuer:
        raise HTTPException(status.HTTP_503_SERVICE_UNAVAILABLE,"OIDC is not configured")
    token=authorization.removeprefix("Bearer ").strip()
    try:
        key=jwks_client(settings.oidc_jwks_url).get_signing_key_from_jwt(token).key
        claims=jwt.decode(token,key,algorithms=["RS256"],audience=settings.oidc_audience,issuer=settings.oidc_issuer)
    except Exception as exc:
        raise HTTPException(status.HTTP_401_UNAUTHORIZED,"Invalid access token") from exc
    roles=claims.get("roles") or claims.get("realm_access",{}).get("roles",[])
    return Principal(subject=claims["sub"],email=claims.get("email"),roles=list(roles))

def require_roles(*allowed:str):
    def dependency(user:Principal=Depends(get_principal)):
        if not set(user.roles).intersection(allowed):
            raise HTTPException(status.HTTP_403_FORBIDDEN,"Insufficient role")
        return user
    return dependency
''',
