          'agrilearn-api/alembic/env.py':'''from logging.config import fileConfig
from alembic import context
from sqlalchemy import engine_from_config,pool
from app.core.config import get_settings
from app.core.database import Base
from app.models import domain
config=context.config
config.set_main_option("sqlalchemy.url",get_settings().database_url)
if config.config_file_name: fileConfig(config.config_file_name)
target_metadata=Base.metadata

def run_migrations_offline():
    context.configure(url=config.get_main_option("sqlalchemy.url"),target_metadata=target_metadata,literal_binds=True,compare_type=True)
    with context.begin_transaction(): context.run_migrations()

def run_migrations_online():
    connectable=engine_from_config(config.get_section(config.config_ini_section),prefix="sqlalchemy.",poolclass=pool.NullPool)
    with connectable.connect() as connection:
        context.configure(connection=connection,target_metadata=target_metadata,compare_type=True)
        with context.begin_transaction(): context.run_migrations()

run_migrations_offline() if context.is_offline_mode() else run_migrations_online()
''',
          'agrilearn-api/alembic/script.py.mako':'''"""${message}
Revision ID: ${up_revision}
Revises: ${down_revision | comma,n}
Create Date: ${create_date}
"""
from typing import Sequence,Union
from alembic import op
import sqlalchemy as sa
revision: str = ${repr(up_revision)}
down_revision: Union[str,None] = ${repr(down_revision)}
branch_labels = ${repr(branch_labels)}
depends_on = ${repr(depends_on)}
def upgrade() -> None:
    ${upgrades if upgrades else "pass"}
def downgrade() -> None:
    ${downgrades if downgrades else "pass"}
''',
          'agrilearn-api/alembic/versions/0001_initial.py':'''"""Initial AgriLearn schema"""
from alembic import op
import sqlalchemy as sa
revision="0001_initial"
down_revision=None
branch_labels=None
depends_on=None

def upgrade():
    op.create_table("users",sa.Column("id",sa.Integer(),primary_key=True),sa.Column("email",sa.String(255),nullable=False),sa.Column("role",sa.String(40),nullable=False),sa.Column("created_at",sa.DateTime(),nullable=False),sa.UniqueConstraint("email"))
    op.create_table("farms",sa.Column("id",sa.Integer(),primary_key=True),sa.Column("owner_id",sa.Integer(),sa.ForeignKey("users.id")),sa.Column("name",sa.String(160),nullable=False),sa.Column("country",sa.String(100),nullable=False),sa.Column("state",sa.String(100),nullable=False),sa.Column("district",sa.String(100)),sa.Column("area",sa.Float(),nullable=False),sa.Column("unit",sa.String(30),nullable=False),sa.Column("soil_type",sa.String(100)))
    op.create_table("fields",sa.Column("id",sa.Integer(),primary_key=True),sa.Column("farm_id",sa.Integer(),sa.ForeignKey("farms.id"),nullable=False),sa.Column("name",sa.String(160),nullable=False),sa.Column("crop",sa.String(100),nullable=False),sa.Column("area",sa.Float(),nullable=False),sa.Column("unit",sa.String(30),nullable=False),sa.Column("planting_date",sa.Date()),sa.Column("growth_stage",sa.String(100)),sa.Column("latitude",sa.Float()),sa.Column("longitude",sa.Float()))
    op.create_table("diagnoses",sa.Column("id",sa.Integer(),primary_key=True),sa.Column("field_id",sa.Integer(),sa.ForeignKey("fields.id")),sa.Column("crop",sa.String(100),nullable=False),sa.Column("image_path",sa.String(500),nullable=False),sa.Column("status",sa.String(50),nullable=False),sa.Column("finding",sa.Text()),sa.Column("confidence",sa.Float()),sa.Column("provider",sa.String(50),nullable=False),sa.Column("created_at",sa.DateTime(),nullable=False))

def downgrade():
    op.drop_table("diagnoses");op.drop_table("fields");op.drop_table("farms");op.drop_table("users")
''',
