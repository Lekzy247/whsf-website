          'agrilearn-api/app/storage/providers.py':'''from pathlib import Path
import boto3
from app.core.config import get_settings

class LocalStorage:
    def __init__(self): self.root=Path(get_settings().storage_dir)
    def put(self,key:str,data:bytes,content_type:str)->str:
        path=self.root/key;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);return str(path)
    def delete(self,key:str)->None:
        path=self.root/key
        if path.exists(): path.unlink()

class S3Storage:
    def __init__(self):
        settings=get_settings();self.bucket=settings.s3_bucket;self.client=boto3.client("s3",region_name=settings.s3_region)
        if not self.bucket: raise RuntimeError("AGRILEARN_S3_BUCKET is required")
    def put(self,key:str,data:bytes,content_type:str)->str:
        self.client.put_object(Bucket=self.bucket,Key=key,Body=data,ContentType=content_type,ServerSideEncryption="AES256")
        return f"s3://{self.bucket}/{key}"
    def delete(self,key:str)->None: self.client.delete_object(Bucket=self.bucket,Key=key)

def get_storage():
    return S3Storage() if get_settings().storage_provider=="s3" else LocalStorage()
''',
