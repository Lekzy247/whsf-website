name: Build AgriLearn AI Workforce Suite

on:
  workflow_run:
    workflows: ["Stabilize AgriLearn Phases 1-10"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agrilearn-ai-workforce
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu