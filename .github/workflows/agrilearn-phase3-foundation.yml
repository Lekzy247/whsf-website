name: Build AgriLearn Phase 3 Foundation

on:
  push:
    paths:
      - '.github/workflows/agrilearn-phase3-foundation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add main-site navigation and Phase 3 application foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root=Path('.')
          pages=['agrilearn-ai.html','agrilearn-platform.html','agrilearn-demo.html','agrilearn-impact.html','agrilearn-partners.html']

          for name in pages:
            p=root/name
            text=p.read_text(encoding='utf-8')
            text=text.replace('>Home</a>', '>Overview</a>')
            if 'class="whsf-return"' not in text:
              text=text.replace('<div class="ag-links" id="ag-links">', '<div class="ag-links" id="ag-links"><a class="whsf-return" href="index.html" title="Return to the main WHSF website">WHSF Main Website</a>')
            if 'manifest.webmanifest' not in text:
              text=text.replace('</head>', '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#116149"><link rel="apple-touch-icon" href="assets/whsf-logo.jpg"></head>')
            p.write_text(text,encoding='utf-8')

          cssp=root/'assets/programs/agrilearn-v2.css'
          css=cssp.read_text(encoding='utf-8')
          extra='''\n.whsf-return{border:1px solid var(--ag-primary)!important;color:var(--ag-primary)!important;background:#fff!important}.whsf-return:hover{background:#edf7f1!important}.phase3-status{display:flex;gap:.55rem;flex-wrap:wrap;margin:1rem 0}.phase3-badge{padding:.4rem .7rem;border-radius:999px;background:#e8f3ed;color:var(--ag-primary);font-size:.82rem;font-weight:800}.saved-session{border:1px solid var(--ag-border);border-radius:12px;padding:.8rem;margin:.6rem 0;background:#fff}.install-app{position:fixed;right:1rem;bottom:1rem;z-index:60;box-shadow:var(--ag-shadow)}\n'''
          if '.whsf-return' not in css: cssp.write_text(css+extra,encoding='utf-8')

          manifest={
            'name':'AgriLearn AI by WHSF','short_name':'AgriLearn AI','start_url':'/agrilearn-ai.html','display':'standalone','background_color':'#f5f8f6','theme_color':'#116149','description':'Responsible, multilingual agricultural learning platform by WHSF.','icons':[{'src':'/assets/whsf-logo.jpg','sizes':'192x192','type':'image/jpeg'},{'src':'/assets/whsf-logo.jpg','sizes':'512x512','type':'image/jpeg'}]
          }
          (root/'manifest.webmanifest').write_text(json.dumps(manifest,indent=2),encoding='utf-8')

          sw='''const CACHE="agrilearn-v3-1";const CORE=["/agrilearn-ai.html","/agrilearn-platform.html","/agrilearn-demo.html","/agrilearn-impact.html","/agrilearn-partners.html","/assets/programs/agrilearn-v2.css","/assets/programs/agrilearn-v2.js","/data/agrilearn-crops.json","/assets/whsf-logo.jpg"];
          self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE))));
          self.addEventListener("activate",e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
          self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith(fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match("/agrilearn-ai.html"))))});'''
          (root/'agrilearn-sw.js').write_text(sw,encoding='utf-8')

          config={
            'version':'3.0-foundation','environment':'production','features':{'pwa':True,'offlineCropLibrary':True,'savedSessions':True,'apiAdapter':True,'realVisionModel':False,'userAuthentication':False,'weatherIntegration':False},
            'api':{'baseUrl':'/api','analysisEndpoint':'/api/agrilearn/analyze','assistantEndpoint':'/api/agrilearn/assistant','mode':'prototype'},
            'notice':'Phase 3 foundation is active. Live AI, authentication and weather services require secured backend services and provider credentials.'
          }
          (root/'data/agrilearn-config.json').write_text(json.dumps(config,indent=2),encoding='utf-8')

          api_js='''window.AgriLearnAPI={
            async config(){return fetch("data/agrilearn-config.json").then(r=>r.json())},
            async analyze(payload){const cfg=await this.config();if(cfg.api.mode!=="live")return {mode:"prototype",confidence:0.78,label:payload.crop?`${payload.crop} learning assessment`:"Crop learning assessment",message:"Prototype response. Confirm field decisions with a qualified agricultural professional."};const r=await fetch(cfg.api.analysisEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok)throw new Error("Analysis service unavailable");return r.json()},
            saveSession(session){const items=JSON.parse(localStorage.getItem("agrilearnSessions")||"[]");items.unshift({...session,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),savedAt:new Date().toISOString()});localStorage.setItem("agrilearnSessions",JSON.stringify(items.slice(0,20)));return items[0]},
            getSessions(){return JSON.parse(localStorage.getItem("agrilearnSessions")||"[]")}
          };'''
          (root/'assets/programs/agrilearn-api.js').write_text(api_js,encoding='utf-8')

          app_js='''(()=>{
            if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/agrilearn-sw.js").catch(()=>{}));
            let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;const b=document.createElement("button");b.className="ag-btn ag-btn-primary install-app";b.textContent="Install AgriLearn";b.onclick=async()=>{b.remove();deferred.prompt();await deferred.userChoice;deferred=null};document.body.appendChild(b)});
            const output=document.querySelector("#analysis-output"),crop=document.querySelector("#crop-select"),part=document.querySelector("#plant-part"),btn=document.querySelector("#analyze-btn");
            if(btn&&window.AgriLearnAPI){btn.addEventListener("click",()=>setTimeout(()=>{if(!crop.value)return;window.AgriLearnAPI.saveSession({crop:crop.options[crop.selectedIndex].text,plantPart:part.value,result:output?.innerText||"Prototype analysis"});renderSessions()},80))}
            function renderSessions(){const host=document.querySelector("#saved-sessions");if(!host||!window.AgriLearnAPI)return;const items=window.AgriLearnAPI.getSessions();host.innerHTML=items.length?items.slice(0,5).map(x=>`<div class="saved-session"><strong>${x.crop}</strong><small>${new Date(x.savedAt).toLocaleString()} · ${x.plantPart}</small></div>`).join(""):"<p>No saved prototype sessions yet.</p>"}
            renderSessions();
          })();'''
          (root/'assets/programs/agrilearn-phase3.js').write_text(app_js,encoding='utf-8')

          for name in pages:
            p=root/name;text=p.read_text(encoding='utf-8')
            if 'agrilearn-api.js' not in text:
              text=text.replace('</head>','<script src="assets/programs/agrilearn-api.js" defer></script><script src="assets/programs/agrilearn-phase3.js" defer></script></head>')
            p.write_text(text,encoding='utf-8')

          demo=root/'agrilearn-demo.html'
          text=demo.read_text(encoding='utf-8')
          if 'id="saved-sessions"' not in text:
            text=text.replace('<hr><h3>AgriLearn Assistant</h3>','<hr><h3>Saved sessions</h3><div id="saved-sessions"></div><hr><h3>AgriLearn Assistant</h3>')
          if 'Phase 3 foundation' not in text:
            text=text.replace('<p class="legacy-note"><strong>Prototype notice:', '<div class="phase3-status"><span class="phase3-badge">Installable PWA</span><span class="phase3-badge">Offline crop library</span><span class="phase3-badge">Saved sessions</span><span class="phase3-badge">API-ready architecture</span></div><p class="legacy-note"><strong>Phase 3 foundation:</strong> The application shell is now installable, offline-aware and API-ready. Live vision AI and user accounts require secured backend services and credentials.</p><p class="legacy-note"><strong>Prototype notice:')
          demo.write_text(text,encoding='utf-8')

          readme=root/'AGRILEARN_PHASE3.md'
          readme.write_text('''# AgriLearn AI Phase 3 Foundation\n\nImplemented:\n- Clear return path to the WHSF main website\n- AgriLearn navigation label changed from Home to Overview\n- Progressive Web App manifest and service worker\n- Offline caching for the five-page application shell and crop dataset\n- API adapter for future secured analysis and assistant services\n- Browser-based saved prototype sessions\n- Feature configuration file\n\nNot yet production-connected:\n- Live computer-vision model\n- User authentication and cloud profiles\n- Weather API\n- Database-backed administration\n- Server-side audit and consent records\n\nThese require provider selection, credentials, privacy decisions and secured backend deployment.\n''',encoding='utf-8')

          for f in pages:
            t=(root/f).read_text(encoding='utf-8')
            assert 'WHSF Main Website' in t
            assert '>Overview</a>' in t
            assert 'manifest.webmanifest' in t
          for f in ['manifest.webmanifest','agrilearn-sw.js','assets/programs/agrilearn-api.js','assets/programs/agrilearn-phase3.js','data/agrilearn-config.json','AGRILEARN_PHASE3.md']:
            assert (root/f).exists(),f
          PY

      - name: Commit Phase 3 foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agrilearn-*.html assets/programs/agrilearn-v2.css assets/programs/agrilearn-api.js assets/programs/agrilearn-phase3.js data/agrilearn-config.json manifest.webmanifest agrilearn-sw.js AGRILEARN_PHASE3.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Launch AgriLearn Phase 3 application foundation"
            git push
          fi
