name: Build AgriLearn Phase 6 Backend MVP

on:
  push:
    paths:
      - '.github/workflows/agrilearn-phase6-backend-mvp.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate backend MVP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('.')
          api=root/'agrilearn-api'
          app=api/'app'
          tests=api/'tests'
          for p in [app/'api/routes',app/'core',app/'models',app/'schemas',app/'services',tests]: p.mkdir(parents=True,exist_ok=True)

          files={
          'agrilearn-api/requirements.txt':'''fastapi==0.115.6
uvicorn[standard]==0.34.0
pydantic-settings==2.7.1
sqlalchemy==2.0.36
psycopg[binary]==3.2.3
python-multipart==0.0.20
httpx==0.28.1
pytest==8.3.4
''',
          'agrilearn-api/.env.example':'''AGRILEARN_ENV=development
AGRILEARN_DATABASE_URL=sqlite:///./agrilearn.db
AGRILEARN_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:5500
AGRILEARN_STORAGE_DIR=./storage
AGRILEARN_WEATHER_PROVIDER=demo
AGRILEARN_VISION_PROVIDER=demo
AGRILEARN_SECRET_KEY=replace-in-production
''',
