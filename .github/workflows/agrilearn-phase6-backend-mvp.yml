    field=client.post(f"/api/agrilearn/v1/farms/{farm['id']}/fields",json={"name":"North Field","crop":"Cassava","area":1.5}).json()
    assert field["crop"]=="Cassava"

def test_demo_weather_warning():
    r=client.get("/api/agrilearn/v1/weather/forecast?lat=7.37&lng=3.94")
