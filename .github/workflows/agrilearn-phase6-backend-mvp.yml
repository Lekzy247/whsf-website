          'agrilearn-api/README.md':'''# AgriLearn AI Backend MVP

This service implements the first operational backend foundation for AgriLearn AI.

## Included
- FastAPI application and OpenAPI documentation
- SQLAlchemy models for users, farms, fields and diagnoses
- Farm and field CRUD foundations
- Validated image upload endpoint
- Demo-only vision and weather adapters
- SQLite local development and PostgreSQL/PostGIS Docker configuration
- CORS configuration, environment settings and tests

## Run locally
```bash
cp .env.example .env
python -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
uvicorn app.main:app --reload
```
Open `http://localhost:8000/docs`.

## Docker
For PostgreSQL/PostGIS, update `.env` with:
`AGRILEARN_DATABASE_URL=postgresql+psycopg://agrilearn:agrilearn-dev-only@db:5432/agrilearn`
Then run `docker compose up --build`.

## Safety
The bundled weather and vision services return demonstration data. They must not be used for planting, spraying, fertilizer, irrigation, diagnosis or treatment decisions. Production providers require credentials, monitoring, agronomic validation and human-review rules.
''',
          'AGRILEARN_PHASE6.md':'''# AgriLearn AI Phase 6 — Backend MVP

Phase 6 introduces a runnable backend foundation rather than another static interface.

## Delivered
- Versioned FastAPI service under `/api/agrilearn/v1`
- OpenAPI/Swagger documentation
- Farm and field database models and endpoints
- Image upload and diagnosis record pipeline
- Weather and vision provider adapter interfaces
- SQLite developer mode
- PostgreSQL/PostGIS Docker environment
- Automated API tests
- Environment-based configuration

## Deliberately deferred
- Real identity provider and access tokens
- Production computer-vision model
- Live weather and satellite data
- Cloud object storage
- database migrations
- background job queue
- push notifications
- production observability and secrets management

## Next engineering milestone
Deploy a protected staging environment, add Alembic migrations and OIDC authentication, connect one verified weather provider, and establish a human-reviewed crop-diagnosis pilot dataset.
'''
