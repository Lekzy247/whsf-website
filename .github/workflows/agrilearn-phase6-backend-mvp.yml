          'agrilearn-api/app/core/config.py':'''from functools import lru_cache
from pydantic_settings import BaseSettings, SettingsConfigDict

class Settings(BaseSettings):
    app_name: str = "AgriLearn AI API"
    env: str = "development"
    database_url: str = "sqlite:///./agrilearn.db"
    allowed_origins: str = "http://localhost:3000"
    storage_dir: str = "./storage"
    weather_provider: str = "demo"
    vision_provider: str = "demo"
    secret_key: str = "replace-in-production"
    model_config = SettingsConfigDict(env_file=".env", env_prefix="AGRILEARN_", extra="ignore")

    @property
    def origins(self) -> list[str]:
        return [x.strip() for x in self.allowed_origins.split(",") if x.strip()]

@lru_cache
def get_settings() -> Settings:
    return Settings()
''',
          'agrilearn-api/app/core/database.py':'''from sqlalchemy import create_engine
from sqlalchemy.orm import DeclarativeBase, sessionmaker
from .config import get_settings

settings=get_settings()
connect_args={"check_same_thread":False} if settings.database_url.startswith("sqlite") else {}
engine=create_engine(settings.database_url,connect_args=connect_args,pool_pre_ping=True)
SessionLocal=sessionmaker(bind=engine,autoflush=False,autocommit=False)

class Base(DeclarativeBase):
    pass

def get_db():
    db=SessionLocal()
    try:
        yield db
    finally:
        db.close()
''',
          'agrilearn-api/app/models/domain.py':'''from datetime import date, datetime
from sqlalchemy import Date, DateTime, Float, ForeignKey, String, Text
from sqlalchemy.orm import Mapped, mapped_column, relationship
from app.core.database import Base

class User(Base):
    __tablename__="users"
    id: Mapped[int]=mapped_column(primary_key=True)
    email: Mapped[str]=mapped_column(String(255),unique=True,index=True)
    role: Mapped[str]=mapped_column(String(40),default="farmer")
    created_at: Mapped[datetime]=mapped_column(DateTime,default=datetime.utcnow)

class Farm(Base):
    __tablename__="farms"
    id: Mapped[int]=mapped_column(primary_key=True)
    owner_id: Mapped[int|None]=mapped_column(ForeignKey("users.id"),nullable=True)
    name: Mapped[str]=mapped_column(String(160))
    country: Mapped[str]=mapped_column(String(100))
    state: Mapped[str]=mapped_column(String(100))
    district: Mapped[str|None]=mapped_column(String(100),nullable=True)
    area: Mapped[float]=mapped_column(Float)
    unit: Mapped[str]=mapped_column(String(30),default="hectares")
    soil_type: Mapped[str|None]=mapped_column(String(100),nullable=True)
    fields: Mapped[list["Field"]]=relationship(back_populates="farm",cascade="all, delete-orphan")

class Field(Base):
    __tablename__="fields"
    id: Mapped[int]=mapped_column(primary_key=True)
    farm_id: Mapped[int]=mapped_column(ForeignKey("farms.id"),index=True)
    name: Mapped[str]=mapped_column(String(160))
    crop: Mapped[str]=mapped_column(String(100))
    area: Mapped[float]=mapped_column(Float)
    unit: Mapped[str]=mapped_column(String(30),default="hectares")
    planting_date: Mapped[date|None]=mapped_column(Date,nullable=True)
    growth_stage: Mapped[str|None]=mapped_column(String(100),nullable=True)
    latitude: Mapped[float|None]=mapped_column(Float,nullable=True)
    longitude: Mapped[float|None]=mapped_column(Float,nullable=True)
    farm: Mapped[Farm]=relationship(back_populates="fields")

class Diagnosis(Base):
    __tablename__="diagnoses"
    id: Mapped[int]=mapped_column(primary_key=True)
    field_id: Mapped[int|None]=mapped_column(ForeignKey("fields.id"),nullable=True,index=True)
    crop: Mapped[str]=mapped_column(String(100))
    image_path: Mapped[str]=mapped_column(String(500))
    status: Mapped[str]=mapped_column(String(50),default="queued")
    finding: Mapped[str|None]=mapped_column(Text,nullable=True)
    confidence: Mapped[float|None]=mapped_column(Float,nullable=True)
    provider: Mapped[str]=mapped_column(String(50),default="demo")
    created_at: Mapped[datetime]=mapped_column(DateTime,default=datetime.utcnow)
''',
          'agrilearn-api/app/schemas/domain.py':'''from datetime import date, datetime
from pydantic import BaseModel, ConfigDict, Field as PydanticField

class FarmCreate(BaseModel):
    name: str=PydanticField(min_length=2,max_length=160)
    country: str
    state: str
    district: str|None=None
    area: float=PydanticField(gt=0)
    unit: str="hectares"
    soil_type: str|None=None

class FarmRead(FarmCreate):
    id: int
    model_config=ConfigDict(from_attributes=True)

class FieldCreate(BaseModel):
    name: str
    crop: str
    area: float=PydanticField(gt=0)
    unit: str="hectares"
    planting_date: date|None=None
    growth_stage: str|None=None
    latitude: float|None=PydanticField(default=None,ge=-90,le=90)
    longitude: float|None=PydanticField(default=None,ge=-180,le=180)

class FieldRead(FieldCreate):
    id: int
    farm_id: int
    model_config=ConfigDict(from_attributes=True)

class DiagnosisRead(BaseModel):
    id: int
    field_id: int|None
    crop: str
    status: str
    finding: str|None
    confidence: float|None
    provider: str
    created_at: datetime
    model_config=ConfigDict(from_attributes=True)

class WeatherRead(BaseModel):
    provider: str
    status: str
    location: dict
    forecast: list[dict]
    warning: str|None=None
''',
          'agrilearn-api/app/services/weather.py':'''from app.core.config import get_settings

class WeatherService:
    def __init__(self):
        self.settings=get_settings()

    async def forecast(self,lat:float,lng:float):
