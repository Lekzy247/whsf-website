          'agrilearn-api/app/main.py':'''from fastapi import FastAPI
from fastapi.middleware.cors import CORSMiddleware
from app.api.router import api_router
from app.core.config import get_settings
from app.core.database import Base,engine
from app.models import domain

settings=get_settings()
Base.metadata.create_all(bind=engine)
app=FastAPI(title=settings.app_name,version="0.1.0",description="AgriLearn AI backend MVP. Demo providers are non-operational and must not guide real farm decisions.")
app.add_middleware(CORSMiddleware,allow_origins=settings.origins,allow_credentials=True,allow_methods=["*"],allow_headers=["*"])
app.include_router(api_router,prefix="/api/agrilearn/v1")
@app.get("/")
def root():
    return {"name":settings.app_name,"docs":"/docs","health":"/api/agrilearn/v1/health"}
''',
          'agrilearn-api/tests/test_api.py':'''from pathlib import Path
import os
os.environ["AGRILEARN_DATABASE_URL"]="sqlite:///./test-agrilearn.db"
os.environ["AGRILEARN_STORAGE_DIR"]="./test-storage"
from fastapi.testclient import TestClient
from app.main import app

client=TestClient(app)

def test_health():
    r=client.get("/api/agrilearn/v1/health")
    assert r.status_code==200 and r.json()["status"]=="ok"

