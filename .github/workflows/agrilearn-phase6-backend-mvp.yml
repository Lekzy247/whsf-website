          'agrilearn-api/app/api/routes/farms.py':'''from fastapi import APIRouter,Depends,HTTPException,status
from sqlalchemy.orm import Session
from app.core.database import get_db
from app.models.domain import Farm,Field
from app.schemas.domain import FarmCreate,FarmRead,FieldCreate,FieldRead

router=APIRouter(prefix="/farms",tags=["farms"])

@router.get("",response_model=list[FarmRead])
def list_farms(db:Session=Depends(get_db)):
    return db.query(Farm).order_by(Farm.id.desc()).all()

@router.post("",response_model=FarmRead,status_code=status.HTTP_201_CREATED)
def create_farm(payload:FarmCreate,db:Session=Depends(get_db)):
    item=Farm(**payload.model_dump())
    db.add(item);db.commit();db.refresh(item)
    return item

@router.get("/{farm_id}",response_model=FarmRead)
def get_farm(farm_id:int,db:Session=Depends(get_db)):
    item=db.get(Farm,farm_id)
    if not item: raise HTTPException(404,"Farm not found")
    return item

@router.get("/{farm_id}/fields",response_model=list[FieldRead])
def list_fields(farm_id:int,db:Session=Depends(get_db)):
    return db.query(Field).filter(Field.farm_id==farm_id).all()

@router.post("/{farm_id}/fields",response_model=FieldRead,status_code=status.HTTP_201_CREATED)
def create_field(farm_id:int,payload:FieldCreate,db:Session=Depends(get_db)):
    if not db.get(Farm,farm_id): raise HTTPException(404,"Farm not found")
    item=Field(farm_id=farm_id,**payload.model_dump())
    db.add(item);db.commit();db.refresh(item)
    return item
''',
          'agrilearn-api/app/api/routes/diagnoses.py':'''from pathlib import Path
from uuid import uuid4
from fastapi import APIRouter,Depends,File,Form,HTTPException,UploadFile,status
from sqlalchemy.orm import Session
from app.core.config import get_settings
from app.core.database import get_db
from app.models.domain import Diagnosis
from app.schemas.domain import DiagnosisRead
from app.services.vision import VisionService

router=APIRouter(prefix="/diagnoses",tags=["diagnoses"])
ALLOWED={"image/jpeg","image/png","image/webp"}

@router.get("",response_model=list[DiagnosisRead])
def list_diagnoses(db:Session=Depends(get_db)):
    return db.query(Diagnosis).order_by(Diagnosis.id.desc()).all()

@router.post("",response_model=DiagnosisRead,status_code=status.HTTP_202_ACCEPTED)
async def create_diagnosis(crop:str=Form(...),field_id:int|None=Form(None),image:UploadFile=File(...),db:Session=Depends(get_db)):
    if image.content_type not in ALLOWED: raise HTTPException(415,"Only JPEG, PNG and WebP images are accepted")
    content=await image.read()
    if len(content)>10*1024*1024: raise HTTPException(413,"Image exceeds 10 MB limit")
    settings=get_settings(); folder=Path(settings.storage_dir)/"diagnoses"; folder.mkdir(parents=True,exist_ok=True)
    ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[image.content_type]
    path=folder/f"{uuid4().hex}.{ext}"; path.write_bytes(content)
    result=await VisionService().analyze(crop,str(path))
    item=Diagnosis(field_id=field_id,crop=crop,image_path=str(path),**result)
    db.add(item);db.commit();db.refresh(item)
    return item
''',
